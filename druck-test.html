<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Drucker-Test (USB)</title>
  </head>
  <body>
    <main class="spike">
      <h1>Drucker-Test: Katasymbol / Supvan per USB</h1>
      <p class="hint">
        Wegwerf-Testseite. Funktioniert nur in Chrome oder Edge am PC. Vorher die Katasymbol-App
        und andere Druckprogramme schließen.
      </p>

      <section>
        <button id="connect">1. Drucker verbinden</button>
        <button id="status" disabled>2. Status lesen</button>
      </section>

      <section class="settings">
        <label>Länge in Laufrichtung (mm) <input id="length" type="number" value="40" min="10" max="200" /></label>
        <label>Breite quer (mm) <input id="width" type="number" value="30" min="10" max="48" /></label>
        <label>
          Ausrichtung
          <select id="direction">
            <option value="1" selected>1 – Standard (Katalog 40×30)</option>
            <option value="0">0 – um 90° gedreht</option>
          </select>
        </label>
        <label>
          Etikettentyp
          <select id="paperType">
            <option value="1" selected>1 – gestanzt (Lücke)</option>
            <option value="0">0 – endlos</option>
            <option value="12">12 – schwarze Markierung</option>
          </select>
        </label>
        <label>Dichte (1–9) <input id="density" type="number" value="4" min="1" max="9" /></label>
      </section>

      <section>
        <p>Vorschau (so werden die Punkte gedruckt, 8 Punkte/mm):</p>
        <canvas id="preview"></canvas>
        <div><button id="print" disabled>3. Testetikett drucken</button></div>
      </section>

      <h2>Protokoll</h2>
      <pre id="log"></pre>
    </main>
    <script type="module" src="/src/spike/druckTest.ts"></script>
  </body>
</html>
